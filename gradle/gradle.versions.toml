[versions]
agp = "9.2.1"
firebase-crashlytics = "3.0.7"
gms = "4.5.0"
koin-compiler = "1.1.0"
kotlin = "2.4.10"
ksp = "2.3.9"
protobuf = "0.10.0"
versions = "0.59.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# https://firebase.google.com/docs/crashlytics/get-started?platform=android
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics" }

# https://github.com/google/ksp
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# https://insert-koin.io
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-compiler" }

# https://developers.google.com/android/guides/google-services-plugin
google-services = { id = "com.google.gms.google-services", version.ref = "gms" }

# https://github.com/google/protobuf-gradle-plugin
google-protobuf = { id = "com.google.protobuf", version.ref = "protobuf" }

# https://github.com/ben-manes/gradle-versions-plugin
versions = { id = "com.github.ben-manes.versions", version.ref = "versions" }
